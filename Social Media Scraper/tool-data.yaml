name: "Social Media Scraper"
slug: "social-media-scraper"
short_description: "Read public social and web content via MCP: Instagram, Facebook, LinkedIn, X, Telegram, YouTube and web pages."
long_description: |
  An MCP tool that lets AI agents read public content without logging in.
  Get public profiles and recent posts from Instagram, Facebook pages,
  LinkedIn and X, read public Telegram channels, read any public web page
  as clean markdown via Jina Reader, and fetch YouTube video transcripts
  from subtitles or auto-captions. Private profiles are not supported.
  An optional Jina API key raises the web-reading rate limit.
version: "1.0.4"
content_rating: "everyone"

categories:
  - "research"
  - "social media"
tags:
  - "scraper"
  - "web"
  - "youtube"
  - "transcripts"
  - "jina"
  - "instagram"
  - "facebook"
  - "linkedin"
  - "x"
  - "telegram"

website: "https://toolstore.com"
support_email: "support@toolstore.com"

pricing:
  type: "free"

functions:
  - name: "scrape_url"
    description: "Read any public web page and return its content as clean markdown."
    actions:
      - "scrape url"
    parameters:
      type: "object"
      properties:
        url:
          type: "string"
          description: "Absolute http(s) URL of the page to read."
        max_chars:
          type: "integer"
          description: "Maximum characters to return (default 20000, max 100000)."
      required: ["url"]

  - name: "get_youtube_transcript"
    description: "Get the transcript of a public YouTube video from its subtitles or auto-captions."
    actions:
      - "get youtube transcript"
    parameters:
      type: "object"
      properties:
        url:
          type: "string"
          description: "youtube.com or youtu.be video URL."
        language:
          type: "string"
          description: "Subtitle language code (default 'en')."
        max_chars:
          type: "integer"
          description: "Maximum characters to return (default 20000, max 100000)."
      required: ["url"]

  - name: "get_telegram_channel_posts"
    description: "Read recent posts from a public Telegram channel."
    actions:
      - "get telegram channel posts"
    parameters:
      type: "object"
      properties:
        channel:
          type: "string"
          description: "Public channel username, e.g. 'durov' or '@durov'."
        max_chars:
          type: "integer"
          description: "Maximum characters to return (default 20000, max 100000)."
      required: ["channel"]

  - name: "get_social_profile"
    description: "Get a public profile from Instagram, Facebook (public pages), LinkedIn or X."
    actions:
      - "get social profile"
    parameters:
      type: "object"
      properties:
        platform:
          type: "string"
          enum: ["instagram", "facebook", "linkedin", "x"]
          description: "Social platform to read from."
        handle:
          type: "string"
          description: "Profile username without URL, e.g. 'natgeo' (Instagram/X), page name (Facebook), or public profile ID (LinkedIn)."
        max_chars:
          type: "integer"
          description: "Maximum characters to return (default 20000, max 100000)."
      required: ["platform", "handle"]

  - name: "get_social_posts"
    description: "Get recent public posts from an Instagram, Facebook page, LinkedIn or X profile."
    actions:
      - "get social posts"
    parameters:
      type: "object"
      properties:
        platform:
          type: "string"
          enum: ["instagram", "facebook", "linkedin", "x"]
          description: "Social platform to read from."
        handle:
          type: "string"
          description: "Profile username without URL, e.g. 'natgeo' (Instagram/X), page name (Facebook), or public profile ID (LinkedIn)."
        limit:
          type: "integer"
          description: "Number of recent posts to return (default 10, max 50)."
        max_chars:
          type: "integer"
          description: "Maximum characters to return (default 20000, max 100000)."
      required: ["platform", "handle"]

activation:
  steps:
    - type: "form"
      title: "Optional API keys"
      description: "All tools work without keys. Add a Jina API key for higher web-reading rate limits."
      required: false
      help_url: "https://jina.ai/reader"
      fields:
        - name: "JINA_API_KEY"
          label: "Jina API Key"
          type: "password"
          required: false
          secret: true
          placeholder: "jina_..."
          description: "Optional. Get a key at jina.ai/reader."
